normalized_tables:
  source_locators:
    primary_key: source_locator_id
    id_format: "^LOC-[ABCD][0-9]{3}-[0-9]{4}$"
    preserve_raw_locator: true
  ratio_definitions:
    primary_key: ratio_id
    id_format: "^RATIO-[ABCD][0-9]{3}-[0-9]{3}$"
    contextual_NPR_required: true
    separate_thermodynamic_and_reference_pressure_types: true
  dimensionless_definitions:
    primary_key: dimensionless_definition_id
    id_format: "^DIM-[ABCD][0-9]{3}-[0-9]{3}$"
    missing_components_use_NV_parameter_records: true
  events:
    primary_key: event_id
    id_format: "^EVT-[ABCD][0-9]{3}-[0-9]{3}$"
    signed_offsets_preserved: true
  intervals:
    primary_key: interval_id
    id_format: "^INT-[ABCD][0-9]{3}-[0-9]{3}$"
    typed_endpoints_required: true
  time_history_registry:
    primary_key: history_id
    id_format: "^HIST-[ABCD][0-9]{3}-[0-9]{3}$"
    figure_digitization: forbidden
  process_relations:
    primary_key: process_relation_id
    id_format: "^PROC-[ABCD][0-9]{3}-[0-9]{3}$"
    causal_language_requires_source_support: true
  pilot_mechanism_relations:
    primary_key: mechanism_relation_id
    id_format: "^MECH-[ABCD][0-9]{3}-[0-9]{3}$"
    scope: pilot_only

policies:
  preserve_reported_units: true
  normalize_to_si_when_definition_confirmed: true
  external_property_lookup: forbidden_in_current_phase
  numeric_zero_as_missing: forbidden
  unverified_source_locator: forbidden
  compare_dimensionless_numbers_without_definition_check: forbidden
  planar_curvature_numeric_zero_by_default: forbidden
  author_breakup_terminology_must_be_preserved: true
  stable_identifiers_must_not_be_regenerated_after_sort: true
  source_locator_id_is_canonical_provenance_link: true
  legacy_source_location_must_be_preserved: true
  missing_reason_required_for_NR_NA_NV: true
  inferred_numeric_value_as_reported: forbidden
  migration_generated_derived_values: forbidden
  orphan_foreign_keys: forbidden
